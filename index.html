<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索結果に載せない設定 -->
  <meta name="robots" content="noindex" />
  <!-- ファビコン・マニフェスト設定 -->
  <link rel="icon" href="./images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  <link rel="manifest" href="./images/site.webmanifest">
  <!-- OGP（SNSシェア用） -->
  <meta property="og:title" content="ありがとうの花">
  <meta property="og:description" content="どこかにいる同級生に匿名で感謝のメッセージを共有するWebサイト">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yachiyo8.github.io/sakura-thanks/">
  <meta property="og:image" content="https://yachiyo8.github.io/sakura-thanks/images/ogp.png">
  <meta property="og:site_name" content="sakura-thanks">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <!-- web fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <!-- css -->
  <link rel="stylesheet" href="style.css">
  <title>ありがとうの花</title>
</head>
<body>
  <!-- Layer -2: 背景アニメーション（最背面） -->
  <div class="bg-move"></div>
  <!-- Layer -1: 桜の花（背景の上） -->
  <div id="sakura-container"></div>
  <!-- Layer 0: メインコンテンツ（最前面） -->
  <div class="container">
    <!-- 1. トップ画面エリア -->
    <div id="top-view" class="top-view-container">
    <h1></h1>
    <!-- 数秒後に遅れて表示させる：使い方とフォーム -->
    <div class="fade-in-target" id="usage-form-section">
      <!-- 使い方 -->
      <section class="usage-card">
        <h2 class="usage-title">使い方</h2>
        <p class="usage-text">
          どこかにいる同級生へ向けて匿名で「ありがとう」の気持ちを届けてみませんか？<br>
          あなたのメッセージが花を咲かせます。<br>
          テキストフォームにメッセージを入力して投稿してみよう！
        </p>
      </section>
      <!-- 入力フォーム -->
      <form class="message-form">
        <textarea class="message-textarea" maxlength="100" placeholder="ここにメッセージを入れます。メッセージは100文字までだよ。まだ実装してないから入力しないでね。"></textarea>
        <button type="submit" class="btn btn-submit">メッセージを投稿する</button>
      </form>
    </div>
    <!-- メッセージカウンター -->
    <div class="counter">
      <p class="counter-label">メッセージカウンター</p>
      <div id="counter-display" class="counter-num">
        <!-- JSで8桁の <span>数字</span> が動的に挿入されます --></div>
    </div>
    <button type="button" id="btn-show-list" class="btn btn-list">みんなのメッセージをみる</button>
    </div>

    <!-- List View（メッセージ一覧画面：初期表示は非表示） -->
    <div id="list-view" class="list-view-container is-hidden">
      <h2 class="list-title">みんなのメッセージ</h2>
      <!-- メッセージカードがここに動的生成される -->
      <div id="message-card-container"></div>
      <!-- トップにもどるボタン -->
      <div class="btn-back-wrapper">
        <button type="button" class="btn btn-top" id="btn-back-top">トップにもどる</button>
      </div>
    </div>

    <p class="copy">&copy; 2026 yachiyo8</p>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
